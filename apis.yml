    type: Documentation
  - url: https://docs.photon.health/reference/clinical-api
    type: APIReference
  - url: graphql/photon-health-graphql.md
    type: GraphQL
  - url: openapi/photon-health-openapi.yml
    type: OpenAPI
  description: Write and manage prescriptions with dosing, dispense quantity, refills,
    days supply, instructions, diagnoses, and effective/expiration dates via prescription,
    prescriptions, createPrescription, createPrescriptions, and cancelPrescription,
    including built-in drug-drug interaction screening.
- aid: photon-health:photon-health-orders-api
