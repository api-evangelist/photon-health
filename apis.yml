description: Photon Health is a modern e-prescribing (eRx) platform that lets digital-health
  organizations create patients, write prescriptions, route orders to pharmacies, and
  manage fulfillment through a single GraphQL Clinical API. The platform pairs the API
  with embeddable Elements UI components, webhooks, and a transparent prescription
  marketplace for pharmacy price and fulfillment comparison.
