    type: Documentation
  - url: https://docs.photon.health/reference/clinical-api
    type: APIReference
  - url: graphql/photon-health-graphql.md
    type: GraphQL
  - url: openapi/photon-health-openapi.yml
    type: OpenAPI
  description: GraphQL queries and mutations for creating and managing patients - demographics,
    sex and gender, contact details, allergies, medication history, addresses, and
    preferred pharmacies - via patient, patients, createPatient, and updatePatient.
- aid: photon-health:photon-health-prescriptions-api
  name: Photon Health Prescriptions API
  tags:
  - Prescriptions
  - eRx
  - Refills
