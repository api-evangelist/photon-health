    type: APIReference
  - url: graphql/photon-health-graphql.md
    type: GraphQL
  - url: openapi/photon-health-openapi.yml
    type: OpenAPI
  description: Subscribe to signed webhook events to receive state changes for orders
    (photon:order:created and related) and prescriptions (photon:prescription:* events),
    typically used to trigger fulfillment emails and save medications to patient profiles.
