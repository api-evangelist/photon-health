  properties:
  - url: https://docs.photon.health/docs/place-orders
    type: Documentation
  - url: https://docs.photon.health/reference/clinical-api
    type: APIReference
  - url: graphql/photon-health-graphql.md
    type: GraphQL
  - url: openapi/photon-health-openapi.yml
    type: OpenAPI
  description: Route prescriptions to pharmacies as orders with fills and delivery
